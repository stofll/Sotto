# Prebuilt sherpa-onnx native archives, pinned by content.
#
# `sherpa-onnx-sys` downloads these from GitHub Releases during the build and
# does not verify them. `fetch-sherpa-runtime.ps1` / `.sh` fetch them instead,
# check them against this file, and hand the result to the build through
# SHERPA_ONNX_LIB_DIR, which turns the crate's own download off.
#
# The version must match the `sherpa-onnx` dependency in
# desktop/src-tauri/Cargo.toml. To re-pin: download the archive, verify it
# against the checksums the release publishes, and record it here.
#
# Format: <target key> <archive file name> <sha256>

