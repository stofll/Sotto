<!doctype html>
<html lang="ru" class="overlay-window">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sotto</title>
    <!-- Прозрачный фон ставится разметкой, а не первым кадром React: окно
         накладное, и белая подложка между показом HWND и монтированием
         компонента была бы видна. -->
    <style>
      html.overlay-window,
      html.overlay-window body,
      html.overlay-window #root {
        background: transparent !important;
        overflow: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay/main.tsx"></script>
  </body>
</html>
