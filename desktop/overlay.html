<!doctype html>
<html lang="ru" class="overlay-window">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sotto</title>
    <!-- The transparent background is set by the markup, not by React's first
         frame: the window is an overlay, and a white backing would be visible
         between the HWND appearing and the component mounting. -->
    <style>
      html.overlay-window,
      html.overlay-window body,
      html.overlay-window #root {
        background: transparent !important;
        overflow: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay/main.tsx"></script>
  </body>
</html>
