<!doctype html>
<html lang="ru" class="tray-window">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sotto</title>
    <!-- The transparent background is set by the markup, not by React's first
         frame: the popup
         всплывает у трея, и белая подложка между показом HWND и монтированием
         компонента была бы видна. -->
    <style>
      html.tray-window,
      html.tray-window body,
      html.tray-window #root {
        background: transparent !important;
        overflow: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/tray/main.tsx"></script>
  </body>
</html>
