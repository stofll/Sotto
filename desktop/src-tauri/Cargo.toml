[package]
name = "sotto"
version = "0.1.3"
description = "Sotto desktop shell"
authors = ["Stofl <152594969+stofll@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/stofll/Sotto"
homepage = "https://github.com/stofll/Sotto"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
semver = "1"
tauri = { version = "2.11.6", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
raw-window-handle = "0.6"
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "macros", "rt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "json"] }
# The crypto provider reqwest is built without; see src/http_client.rs.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
sha2 = "0.10"
fs4 = { version = "1.1", default-features = false }
regex = "1"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "linux-native"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
# A second instance would register the same global hotkey and lose the race
# nondeterministically — single-instance is a correctness fix, not polish.
tauri-plugin-single-instance = "2.4.5"
# Self-update. The plugin downloads and installs the artifact from latest.json
# on GitHub Releases, verifying the minisign signature with the public key from
# tauri.conf.json. Integrity — yes, publisher — no: SmartScreen's "unknown
# publisher" is only cured by Authenticode.
tauri-plugin-updater = "2"
# Synthesizes the paste keystroke on macOS and Linux. Windows does not use it
# for the keystroke — `windows_util::send_ctrl_v_sendinput` sends the raw VK
# instead, see `clipboard.rs` — though the crate is an unconditional dependency
# and still builds and links there, where a test double implements its
# `Keyboard` trait.
#
# Upstream's default feature set, deliberately. 0.3 pinned `features = ["xdo"]`
# with defaults off, which decided nothing: `xdo` was an empty marker feature
# and `default` was `["xdo"]`, so the two resolved identically. The feature
# still exists in 0.6 and could have been carried forward. The reason not to is
# that it selects the Linux X11 backend, upstream moved that default to `x11rb`
# in 0.5 calling it the more reliable of the two, and we have no grounds to
# overrule them: Linux ships no artifact (docs/platforms.md), so this path is
# only ever built in CI. Pinning either backend would mean maintaining an
# opinion about a platform we do not ship. On the bundles that do ship, the
# defaults add no dependency at all — `x11rb`, `nom` and `xkbcommon` are gated
# to unix-not-macos.
#
# 0.4 raised enigo's MSRV to 1.85; the pinned Rust toolchain satisfies it.
enigo = "0.6"
log = "0.4"
# Base (CPU) dependency, with no GPU backend. The backends are opt-in via
# the `gpu` feature below, so a plain `cargo build`/`cargo test` needs no
# Vulkan SDK; release builds turn it on. whisper.cpp falls back to CPU at
# runtime anyway when the GPU can't be initialised.
whisper-rs = "0.14"
dirs = "6"
# 0.16 fixes the CoreAudio disconnect-listener cycle that kept explicitly
# selected microphones recording after their stream was dropped.
cpal = "0.16"
# Bundled SQLite for the data layer (stats, history).
# `bundled` compiles SQLite from source so we don't depend on the system libsqlite3.
rusqlite = { version = "0.40", features = ["bundled"] }
earshot = "1.2.1"
symphonia = { version = "0.6.1", features = ["mp3", "isomp4", "aac", "alac"] }
rubato = "5.0.0"
tauri-plugin-dialog = "2"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
spellbook = "=0.4.2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt"] }

[target.'cfg(windows)'.dependencies]
# Windows uses shared Sherpa libraries packaged by the NSIS hook. `shared`
# rather than the crate's default `static`: the prebuilt Windows static archive
# is built with /MT, while rustc-msvc links the dynamic CRT, and mixing the two
# is not worth the DLL-free bundle. The build script drops the runtime DLLs
# beside the Cargo executable, where `prepare-native-libs.ps1` picks them up.
sherpa-onnx = { version = "=1.13.7", default-features = false, features = ["shared"] }
windows-sys = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    # SetWindowSubclass / DefSubclassProc for the overlay's non-client guard.
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    # CredEnumerateW: the uninstaller's data removal finds stored API keys.
    "Win32_Security_Credentials",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # PlaySoundW (winmm) for the recording cues in `sounds.rs`.
    "Win32_Media_Audio",
    "Win32_Globalization",
] }
# Core Audio volume control for `output_volume.rs`. `windows-sys` exposes COM
# interfaces as opaque pointers with no vtables, so it cannot call methods on
# them; the `windows` crate can. Not a new build cost — Tauri already pulls
# this exact version in through wry/tao.
windows = { version = "0.61", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Embed Sherpa and ONNX Runtime in the app — the crate's default `static`. No
# external dylibs or developer-machine search paths are needed;
# `scripts/check-macos-native-libs.sh` fails the build if one appears anyway.
#
# This build script downloads its native archive without checking a hash, where
# `sherpa-rs` carried a SHA-256 table. `scripts/fetch-sherpa-runtime.sh` fetches
# and verifies it instead, against `scripts/sherpa-runtime.lock`, and hands the
# result over through SHERPA_ONNX_LIB_DIR; CI runs it before every build. A
# plain local `cargo build` with that variable unset still lets the crate
# download for itself.
sherpa-onnx = { version = "=1.13.7" }
tempfile = "3"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSDate",
    "NSGeometry",
    "NSObject",
    "NSTimer",
    "NSRunLoop",
    "NSObjCRuntime",
    "NSString",
    "block2",
    "objc2-core-foundation",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSEvent",
    "NSWindow",
    "bitflags",
] }

[lib]
name = "sotto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The binary name is what the system shows: the icon caption in the dock for an
# unbundled build, Activity Monitor, Force Quit, crash reports, and Sotto.exe on
# Windows. It is taken from here rather than from productName, which is why it
# sits here and not in mainBinaryName: that one renames the binary only on
# `tauri build`, and a dev build would keep being named after the crate.
[[bin]]
name = "Sotto"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# GPU acceleration for whisper.cpp, opt-in per backend. Off by default so
# CI and a plain `cargo build` compile without the Vulkan SDK, whose
# absence otherwise fails `whisper-rs-sys`'s build script outright. The
# runtime is unaffected either way: whisper.cpp with no GPU backend runs on
# the CPU, which is what a machine without a usable GPU did already.
#
# Two features rather than one `gpu`, because Cargo cannot express "vulkan
# here, metal there" under a single name: features are additive and
# target-blind, so one name would pull both backends onto every platform,
# and `metal` does not link outside macOS. Aliasing `whisper-rs` twice does
# not work either — Cargo rejects one crate appearing under two names.
#
# Who turns these on: `scripts/build-installer.bat` (vulkan) and the matrix in
# `.github/workflows/release.yml` (vulkan on Windows, metal on macOS).
gpu-vulkan = ["whisper-rs/vulkan"]
gpu-metal = ["whisper-rs/metal"]

# Opt-in feature that exposes the
# `start_recording_test` Tauri command to production builds. Default
# OFF — only `cargo build`, debug runs, and tests enable it (via
# `#[cfg(any(test, debug_assertions, feature = "test-commands"))]`).
# Reduces the public IPC surface in release binaries.
test-commands = []

[[bench]]
name = "engine_bench"
harness = false

[profile.bench]
opt-level = 3
lto = "thin"

[profile.release]
opt-level = 3
lto = true
panic = "unwind"  # Required for catch_unwind around whisper-rs state.full()
