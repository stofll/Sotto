# Мутационный прогон (issue #32, план 2026-08-28-mutation-coverage.md).
#
# Прогон гоняем только по юнит-тестам: сборка --all-targets тянет
# интеграционные тесты, бенчи и примеры и стоит 24 с против 5 с на мутанта.
# Погрешность замерена — 9 мутантов из 1025.
additional_cargo_args = ["--lib"]

# Win32/FFI-обвязка: юнит-тестами не берётся, мутанты здесь — шум.
exclude_globs = [
    "src/windows/**",
    "src/windows_util.rs",
    "src/mic_test.rs",
    "src/accessibility.rs",
    "src/audio_worker.rs",
    "src/whisper.rs",
    "src/sherpa.rs",
    "src/main.rs",
]

exclude_re = [
    # Болванки трейта FormatStep: name/description/enabled/set_enabled.
    '<impl FormatStep for \w+>::(name|description|enabled|set_enabled)',
    # Тексты для человека и служебные Display.
    '::fmt',

    # --- Очередь 1 (2026-08-28-mutation-coverage.md) ---

    # secret_store: FFI-обёртки над keyring (запись в реальный Credential
    # Manager). Композиция KeyMeta вынесена в key_meta_from и покрыта тестом.
    'get_key',
    'delete_key',

    # model_download: обвязка над fs2::available_space и шим поверх
    # free_space_verdict (чистая проверка вынесена и покрыта тестом).
    'available_bytes',
    'ensure_free_space',

    # config: шимы над config_path/app_config_dir — логика вынесена в *_at
    # и *_from, которые покрыты тестами.
    'load_hotkey -> ',
    'config_path -> ',
    'Config::save -> ',
    'migrate_legacy_device -> ',
    'save_with_merge_patch -> ',

    # db: эквивалентные мутанты run_migrations. `current < N` → `<=` для
    # v1/v2 повторно применяет идемпотентный CREATE IF NOT EXISTS (без
    # эффекта), для v4 недостижимо из-за guard `current >= SCHEMA_VERSION`.
    # Ступень v3 (ALTER TABLE ADD COLUMN) ловится тестом
    # run_migrations_from_v3_must_not_reapply_v3, но попадает под тот же
    # текст описания.
    'replace < with <= in run_migrations',

    # history: select_limit (тернарник `max_entries > 0` → -1) дублирует
    # DELETE-ограничение выше, поэтому подмена `>` → `<` эквивалентна.
    # Остальные `>` → `<` в list_history_from ловятся тестами.
    'replace > with < in list_history_from',

    # model: возврат статической таблицы и шимы над models_dir() (логика
    # вынесена в *_at / *_in и покрыта тестами).
    'bundle_manifest -> ',
    'bundle_is_ready -> ',
    'verify_bundle_files -> ',
    # Размер буфера чтения при хешировании (64 KiB): `+` даёт 1088 байт и
    # безвреден — меняется только размер чанка, не результат хеша.
    'replace \* with \+ in verify_artifact',
    # Эквивалентный мутант: guard `error.kind() == NotFound` → `true` делает
    # любую ошибку stat неотличимой от «каталога нет», но другие ошибки stat
    # в юнит-тесте не воспроизводимы.
    'NotFound with true',

    # --- Очередь 2 (ai/*, cloud_stt) ---

    # providers: геттеры name() — константы, а не логика.
    '>::name',
    # providers: ветка лога о неизвестной модели — только log::info.
    'delete ! in <impl Provider for OpenCodeGoProvider>::complete',
    # providers: сетевой слой send_request и статический клиент покрываются
    # интеграционными тестами tests/ai_mock_test.rs — прогон --lib их не видит.
    'send_request',
    'shared_client',
    # providers: сдвиг `close + 1` в tokenise_path эквивалентен — следующий
    # find('[') пересинхронизирует позицию при любом off-by-one.
    'in tokenise_path',
    # cloud_stt: BYTE_RATE = SAMPLE_RATE * NUM_CHANNELS * … / 8, а NUM_CHANNELS=1,
    # поэтому `*` → `/` даёт тот же результат (эквивалент).
    'src/cloud_stt.rs:75:',
    # cloud_stt: ветка HTTP-статуса и truncate покрываются интеграционными
    # тестами tests/cloud_stt_mock_test.rs — прогон --lib их не видит.
    'delete ! in transcribe',
    'truncate',
    # step: `min_duration > 0` → `>=` эквивалентен — при min=0 вторая часть
    # условия (`audio < 0`) ложна для любого реального (неотрицательного) звука.
    'replace > with >= in duration_below_threshold',
    # step: форматирование времени дня инвариантно к сдвигу на целые сутки —
    # `-` → `+` и `day_of_year * 86400` → `/` не меняют hours/minutes (mod 24/60).
    'replace - with \+ in format_timestamp',
    'replace \* with / in format_timestamp',
    # step: рука `"anthropic"` в build_provider дублирует фолбэк `_` (тоже
    # AnthropicProvider) — удаление руки даёт тот же результат.
    'delete match arm "anthropic" in build_provider',

    # --- Очередь 3 (vad, wav, …) ---

    # vad: проверка кадра `len < FRAME` → `==`/`<=` различима только на вводе
    # ровно в один кадр, который VAD без контекста не признаёт речью; порог
    # `predict > 0.5` → `>=` различается только при score ровно 0.5. Обе
    # мутации эквивалентны на любом практическом вводе.
    'replace < with == in speech_range',
    'replace < with <= in speech_range',
    'replace > with >= in speech_range',

    # audio_file: guard `rate > 0` → `>=` — rate из спеки декодера не бывает
    # нулевым; ветка защищает только от деления на ноль.
    'replace > with >= in decode_with_limit',
    # audio_file: guard UnexpectedEof → `true` — прочие IoError в чтении
    # локального файла не встречаются, различие невоспроизводимо в тесте.
    'match guard e\.kind\(\) == std::io::ErrorKind::UnexpectedEof with true',
    # audio_file: reserve(...) — только подсказка ёмкости, не влияет на выход.
    'src/audio_file.rs:213:',
    # audio_file: арифметика resample-петли поверх rubato. `ratio /` → `%`
    # даёт абсурдный, но валидный множитель (бесконечный прогон); `<` → `<=`
    # и `expected_len + delay` → `*` гасятся truncate; буфер `in_chunk.len()
    # < needed` → `==`/`>` эквивалентны, т.к. needed постоянен (FixedAsync::Input).
    'replace / with % in resample_to_target',
    'replace < with <= in resample_to_target',
    'replace < with == in resample_to_target',
    'replace < with > in resample_to_target',
    'replace \+ with \* in resample_to_target',

    # audio: методы AudioRecorder общаются с реальным аудиоустройством (cpal),
    # юнит-тестом без железа не берутся.
    'AudioRecorder::start',
    'AudioRecorder::stop',
    'AudioRecorder::is_recording',
    'AudioRecorder::level',
    'AudioRecorder::list_devices',
    # audio: `channels > 1` → `>=` эквивалентен — для одного канала
    # chunks_exact(1) даёт тот же массив; `delete !` в ветке misaligned —
    # только log::warn; `<` → `<=` в проверке ratio эквивалентен — точный
    # ratio даёт 0.0, а порог 0.01.
    'replace > with >= in process_samples',
    'delete ! in process_samples',
    'replace < with <= in process_samples',

    # --- Очередь 3 (formatter) ---

    # formatter: рука `"word"` дублирует фолбэк `_ => Word`.
    'delete match arm "word" in ReplacementRule::from_value',
    # formatter: `!rules.is_empty()` на выходе из формы-массива — объект не
    # может быть массивом, фолбэк ниже не сработает, ветка эквивалентна.
    'src/formatter.rs:386:',
    # formatter: 'ъ'|'ь' дают "" — как и фолбэк `_`.
    'src/formatter.rs:1077:',
    # formatter: обход сегментов в HallucinationCleaner::apply. Поведение
    # (галлюцинации убираются, диктовка выживает) покрыто тестами; оставшиеся
    # мутанты — сдвиг индексов i/j/seg_start/end_byte в обходе, который на
    # реальных входах эквивалентен (или, для `+=` → `*=`, зацикливается).
    'replace < with (==|>|<=) in <impl FormatStep for HallucinationCleaner>::apply',
    'replace > with (==|<|>=) in <impl FormatStep for HallucinationCleaner>::apply',
    'replace && with \|\| in <impl FormatStep for HallucinationCleaner>::apply',
    'replace == with != in <impl FormatStep for HallucinationCleaner>::apply',
    'replace \+= with (-=|\*=) in <impl FormatStep for HallucinationCleaner>::apply',
    'replace \+ with (-|\*) in <impl FormatStep for HallucinationCleaner>::apply',
    # formatter: apply_case_of — guard `first.is_lowercase()` → `true`
    # эквивалентен: capitalize уже заглавной буквы — no-op.
    'replace match guard first\.is_lowercase\(\) with true in apply_case_of',
    # formatter: best_match — `n > 1` → `>=` (для n=1 trimmed=0, эффекта нет)
    # и tie-break `score < best_score` → `>`/`with false` (поведение уже
    # покрыто the_longer_term_wins; мутация меняет только порядок итерации).
    'replace > with >= in CustomWordsCorrector::best_match',
    'replace < with > in CustomWordsCorrector::best_match',
    'replace match guard score < best_score with false in CustomWordsCorrector::best_match',
    # formatter: обходы токенов в DuplicateWordsRemover / PhraseLoopCollapser /
    # CustomWordsCorrector::apply / collapse_phrase_loops. Поведение покрыто
    # тестами (dedupe, collapse, dictionary); мутации `+=`/`!=`/`-` в while-
    # циклах зацикливаются, а границы `>`/`<` дают пустые токены (эквивалент).
    'replace \+= with (-=|\*=) in <impl FormatStep for CustomWordsCorrector>::apply',
    'replace != with == in <impl FormatStep for DuplicateWordsRemover>::apply',
    'replace != with == in <impl FormatStep for PhraseLoopCollapser>::apply',
    'replace > with >= in dedupe_adjacent_words',
    'replace < with <= in dedupe_adjacent_words',
    'replace < with (==|<=) in collapse_phrase_loops',
    'replace - with / in collapse_phrase_loops',
    'delete ! in collapse_phrase_loops',
    'replace \+= with (-=|\*=) in collapse_phrase_loops',
    # formatter: ещё три мутанта в разборе повторов не проходят, а зависают,
    # и прогон помечает их таймаутом. `repeats *= 1` не двигает счётчик;
    # `start * (n * repeats)` при start = 0 не двигает позицию; снятый `!` в
    # поиске конца разделителя оставляет rest на месте, и внешний while
    # крутится вечно. Поведение самих функций закрыто тестами на схлопывание
    # повторов, а держать в прогоне три мутанта по минуте каждый — только
    # удлинять его.
    'replace \+ with \* in count_phrase_repeats',
    'replace \+= with \*= in count_phrase_repeats',
    'delete ! in tokenize_loop_words',
]

timeout_multiplier = 5.0
