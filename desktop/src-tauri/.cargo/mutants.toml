# Mutation run (issue #32, plan 2026-08-28-mutation-coverage.md).
#
# We run against unit tests only: an --all-targets build drags in integration
# tests, benches and examples and costs 24 s against 5 s per mutant. The error
# this introduces was measured — 9 mutants out of 1025.
additional_cargo_args = ["--lib"]

# Win32/FFI glue: not reachable by unit tests, mutants here are noise.
exclude_globs = [
    "src/windows/**",
    "src/windows_util.rs",
    "src/mic_test.rs",
    "src/accessibility.rs",
    "src/audio_worker.rs",
    "src/whisper.rs",
    "src/sherpa.rs",
    "src/main.rs",
]

exclude_re = [
    # FormatStep trait stubs: name/description/enabled/set_enabled.
    '<impl FormatStep for \w+>::(name|description|enabled|set_enabled)',
    # Human-facing text and utility Display impls.
    '::fmt',

    # --- Queue 1 (2026-08-28-mutation-coverage.md) ---

    # secret_store: FFI wrappers over keyring (writing to the real Credential
    # Manager). KeyMeta composition is extracted into key_meta_from and covered.
    'get_key',
    'delete_key',

    # model_download: glue over fs2::available_space and a shim over
    # free_space_verdict (the pure check is extracted and covered by a test).
    'available_bytes',
    'ensure_free_space',

    # config: shims over config_path/app_config_dir — the logic is extracted
    # into *_at and *_from, which are covered by tests.
    'load_hotkey -> ',
    'config_path -> ',
    'Config::save -> ',
    'migrate_legacy_device -> ',
    'save_with_merge_patch -> ',

    # db: equivalent mutants in run_migrations. `current < N` → `<=` re-applies
    # the idempotent CREATE IF NOT EXISTS for v1/v2 (no effect), and for v4 is
    # unreachable because of the `current >= SCHEMA_VERSION` guard. The v3 step
    # (ALTER TABLE ADD COLUMN) is caught by
    # run_migrations_from_v3_must_not_reapply_v3, but falls under the same
    # description text.
    'replace < with <= in run_migrations',

    # history: select_limit (the `max_entries > 0` ternary → -1) duplicates the
    # DELETE limit above, so swapping `>` → `<` is equivalent. The remaining
    # `>` → `<` in list_history_from are caught by tests.
    'replace > with < in list_history_from',

    # model: returning a static table, plus shims over models_dir() (the logic
    # is extracted into *_at / *_in and covered by tests).
    'bundle_manifest -> ',
    'bundle_is_ready -> ',
    'verify_bundle_files -> ',
    # Read buffer size when hashing (64 KiB): `+` yields 1088 bytes and is
    # harmless — only the chunk size changes, not the hash result.
    'replace \* with \+ in verify_artifact',
    # Equivalent mutant: the `error.kind() == NotFound` guard → `true` makes any
    # stat error indistinguishable from "the directory is missing", but other
    # stat errors are not reproducible in a unit test.
    'NotFound with true',

    # --- Queue 2 (ai/*, cloud_stt) ---

    # providers: the name() getters are constants, not logic.
    '>::name',
    # providers: the unknown-model log branch is only a log::info.
    'delete ! in <impl Provider for OpenCodeGoProvider>::complete',
    # providers: the send_request network layer and the static client are
    # covered by tests/ai_mock_test.rs — a --lib run does not see them.
    'send_request',
    'shared_client',
    # providers: shifting `close + 1` in tokenise_path is equivalent — the next
    # find('[') resynchronises the position on any off-by-one.
    'in tokenise_path',
    # cloud_stt: BYTE_RATE = SAMPLE_RATE * NUM_CHANNELS * … / 8, and NUM_CHANNELS
    # is 1, so `*` → `/` gives the same result (equivalent).
    'src/cloud_stt.rs:75:',
    # cloud_stt: the HTTP status branch and truncate are covered by
    # tests/cloud_stt_mock_test.rs — a --lib run does not see them.
    'delete ! in transcribe',
    'truncate',
    # step: `min_duration > 0` → `>=` is equivalent — with min = 0 the second
    # half of the condition (`audio < 0`) is false for any real audio.
    'replace > with >= in duration_below_threshold',
    # step: time-of-day formatting is invariant under whole-day shifts — `-` → `+`
    # and `day_of_year * 86400` → `/` do not change hours/minutes (mod 24/60).
    'replace - with \+ in format_timestamp',
    'replace \* with / in format_timestamp',
    # step: the `"anthropic"` arm in build_provider duplicates the `_` fallback
    # (also AnthropicProvider) — removing the arm gives the same result.
    'delete match arm "anthropic" in build_provider',

    # --- Queue 3 (vad, wav, …) ---

    # vad: the frame check `len < FRAME` → `==`/`<=` is distinguishable only on
    # input of exactly one frame, which VAD does not accept as speech without
    # context; the `predict > 0.5` threshold → `>=` differs only when the score
    # is exactly 0.5. Both mutations are equivalent on any practical input.
    'replace < with == in speech_range',
    'replace < with <= in speech_range',
    'replace > with >= in speech_range',

    # audio_file: the `rate > 0` guard → `>=` — a rate from the decoder spec is
    # never zero; the branch only guards against division by zero.
    'replace > with >= in decode_with_limit',
    # audio_file: the UnexpectedEof guard → `true` — other IoErrors do not occur
    # when reading a local file, the difference is not reproducible in a test.
    'match guard e\.kind\(\) == std::io::ErrorKind::UnexpectedEof with true',
    # audio_file: reserve(...) is only a capacity hint, it does not affect output.
    'src/audio_file.rs:213:',
    # audio_file: arithmetic of the resample loop over rubato. `ratio /` → `%`
    # gives an absurd but valid multiplier (an endless run); `<` → `<=` and
    # `expected_len + delay` → `*` are absorbed by truncate; the buffer check
    # `in_chunk.len() < needed` → `==`/`>` is equivalent, since needed is
    # constant (FixedAsync::Input).
    'replace / with % in resample_to_target',
    'replace < with <= in resample_to_target',
    'replace < with == in resample_to_target',
    'replace < with > in resample_to_target',
    'replace \+ with \* in resample_to_target',

    # audio: AudioRecorder methods talk to a real audio device (cpal) and are
    # not reachable by a unit test without hardware.
    'AudioRecorder::start',
    'AudioRecorder::stop',
    'AudioRecorder::is_recording',
    'AudioRecorder::level',
    'AudioRecorder::list_devices',
    # audio: `channels > 1` → `>=` is equivalent — for a single channel
    # chunks_exact(1) yields the same array; deleting the `!` in the misaligned
    # branch only affects a log::warn; `<` → `<=` in the ratio check is
    # equivalent — an exact ratio gives 0.0 against a 0.01 threshold.
    'replace > with >= in process_samples',
    'delete ! in process_samples',
    'replace < with <= in process_samples',

    # --- Queue 3 (formatter) ---

    # formatter: the `"word"` arm duplicates the `_ => Word` fallback.
    'delete match arm "word" in ReplacementRule::from_value',
    # formatter: `!rules.is_empty()` on the array-form exit — an object cannot
    # be an array, the fallback below never fires, the branch is equivalent.
    'src/formatter.rs:386:',
    # formatter: 'ъ' | 'ь' produce "" — same as the `_` fallback.
    'src/formatter.rs:1077:',
    # formatter: segment traversal in HallucinationCleaner::apply. The behaviour
    # (hallucinations removed, dictation survives) is covered by tests; the
    # remaining mutants shift the i/j/seg_start/end_byte indices in the
    # traversal, which on real input is equivalent (or, for `+=` → `*=`, loops
    # forever).
    'replace < with (==|>|<=) in <impl FormatStep for HallucinationCleaner>::apply',
    'replace > with (==|<|>=) in <impl FormatStep for HallucinationCleaner>::apply',
    'replace && with \|\| in <impl FormatStep for HallucinationCleaner>::apply',
    'replace == with != in <impl FormatStep for HallucinationCleaner>::apply',
    'replace \+= with (-=|\*=) in <impl FormatStep for HallucinationCleaner>::apply',
    'replace \+ with (-|\*) in <impl FormatStep for HallucinationCleaner>::apply',
    # formatter: apply_case_of — guard `first.is_lowercase()` → `true`
    # equivalent: capitalize on an already-capital letter is a no-op.
    'replace match guard first\.is_lowercase\(\) with true in apply_case_of',
    # formatter: best_match — `n > 1` → `>=` (for n = 1 trimmed is 0, no effect)
    # and the tie-break `score < best_score` → `>` / `with false` (the behaviour
    # is already covered by the_longer_term_wins; the mutation only changes the
    # iteration order).
    'replace > with >= in CustomWordsCorrector::best_match',
    'replace < with > in CustomWordsCorrector::best_match',
    'replace match guard score < best_score with false in CustomWordsCorrector::best_match',
    # formatter: token traversal in DuplicateWordsRemover / PhraseLoopCollapser /
    # CustomWordsCorrector::apply / collapse_phrase_loops. The behaviour is
    # covered by tests (dedupe, collapse, dictionary); `+=`/`!=`/`-` mutations in
    # the while loops hang, and the `>`/`<` bounds produce empty tokens.
    'replace \+= with (-=|\*=) in <impl FormatStep for CustomWordsCorrector>::apply',
    'replace != with == in <impl FormatStep for DuplicateWordsRemover>::apply',
    'replace != with == in <impl FormatStep for PhraseLoopCollapser>::apply',
    'replace > with >= in dedupe_adjacent_words',
    'replace < with <= in dedupe_adjacent_words',
    'replace < with (==|<=) in collapse_phrase_loops',
    'replace - with / in collapse_phrase_loops',
    'delete ! in collapse_phrase_loops',
    'replace \+= with (-=|\*=) in collapse_phrase_loops',
    # formatter: three more mutants in repeat parsing do not fail but hang, and
    # the run marks them as timeouts. `repeats *= 1` never advances the counter;
    # `start * (n * repeats)` with start = 0 never advances the position;
    # dropping the `!` in the separator-end search leaves rest in place and the
    # outer while spins forever. The behaviour of these functions is covered by
    # the repeat-collapsing tests, and keeping three mutants at a minute each
    # only makes the run longer.
    'replace \+ with \* in count_phrase_repeats',
    'replace \+= with \*= in count_phrase_repeats',
    'delete ! in tokenize_loop_words',
]

timeout_multiplier = 5.0
