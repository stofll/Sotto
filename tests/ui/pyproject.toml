[project]
name = "sotto-ui-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3,<4",
    "pytest>=8,<10",
    "pytest-playwright>=0.7,<1",
    "pytest-xdist>=3,<4",
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "--tracing=retain-on-failure --screenshot=only-on-failure --output=test-results"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
