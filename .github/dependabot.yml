# Propose compatible version updates monthly, grouped by ecosystem and capped
# at two open pull requests each. Review major upgrades separately when there
# is a concrete need and time for native verification (docs/testing.md).
version: 2

updates:
  - package-ecosystem: cargo
    directories:
      - /desktop/src-tauri
      - /desktop/setup/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      rust-minor:
        update-types: [minor, patch]
    ignore:
      # Pinned together with scripts/sherpa-runtime.lock; the runtime and the
      # bindings move in one change.
      - dependency-name: sherpa-onnx
      - dependency-name: sherpa-onnx-sys

  - package-ecosystem: npm
    directories:
      - /desktop
      - /site
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      js-minor:
        update-types: [minor, patch]
    ignore:
      # React 19.3 adds about 30 kB to the startup chunk of every window and
      # nothing the app uses; update it when a feature needs it.
      - dependency-name: react
        update-types: [version-update:semver-minor]
      - dependency-name: react-dom
        update-types: [version-update:semver-minor]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-minor]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-minor]

  - package-ecosystem: uv
    directories:
      - /tests/ui
      - /scripts/macos-dmg
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      python:
        update-types: [minor, patch]

  # Keeps the SHA pins current; the trailing version comments are updated
  # with them.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      actions:
        update-types: [minor, patch]
