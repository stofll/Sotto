name: Prepare Release
run-name: Prepare release (${{ inputs.channel || 'beta' }}, ${{ inputs.version || inputs.kind || 'scheduled patch' }})

on:
  schedule:
    # Monday and Thursday at 21:00 Moscow time (UTC+3).
    - cron: '0 18 * * 1,4'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (scheduled builds use beta)
        type: choice
        default: stable
        options: [stable, beta]
      kind:
        description: Version bump (ignored when an exact version is supplied)
        type: choice
        default: patch
        options: [patch, minor, major]
      version:
        description: Optional base version, e.g. 0.3.0 (without v or beta suffix)
        type: string
        required: false

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Check release changes
    if: github.repository == 'stofll/Sotto' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Test release preparation
        run: node --test scripts/release-version.test.mjs scripts/check-release-source.test.mjs scripts/check-release-changes.test.mjs

      - name: Decide whether to prepare a release
        id: changes
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_SOURCE: ${{ github.sha }}
        run: |
          if [ "$RELEASE_EVENT" = 'schedule' ]; then
            node scripts/check-release-changes.mjs
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  source-rust:
    name: Release source CI
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/rust-ci.yml
    with:
      ref: ${{ github.sha }}

  source-ui:
    name: Release source UI tests
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    uses: ./.github/workflows/ui-tests.yml
    with:
      ref: ${{ github.sha }}

  prepare:
    name: Commit and tag release version
    needs: [plan, source-rust, source-ui]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.changed == 'true' &&
          needs.source-rust.result == 'success' && needs.source-ui.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Calculate and synchronize version
        id: version
        env:
          RELEASE_KIND: ${{ inputs.kind || 'patch' }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel || 'beta' }}
        run: node scripts/release-version.mjs

      # Only this short-lived token can bypass the PR/CI ruleset. Its scope is
      # the current repository; normal build jobs retain GITHUB_TOKEN.
      - name: Create release bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit only version changes and push atomically
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          bot_id=$(gh api "users/${BOT_SLUG}[bot]" --jq .id)
          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${bot_id}+${BOT_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
          git add desktop/src-tauri/Cargo.toml desktop/src-tauri/Cargo.lock desktop/package.json desktop/src-tauri/Info.plist
          git commit -m "chore(release): prepare $RELEASE_TAG"
          node --input-type=module <<'JS'
          import { verifyReleaseCommit } from './scripts/release-version.mjs';
          verifyReleaseCommit(process.cwd(), process.env.RELEASE_SOURCE, process.env.RELEASE_TAG.slice(1));
          JS
          sh scripts/check-version.sh "$RELEASE_TAG"
          git fetch origin main --tags
          if [ "$(git rev-parse origin/main)" != "$RELEASE_SOURCE" ]; then
            echo '::error::main changed during preparation. Start a new Prepare Release run.'
            exit 1
          fi
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          # Both refs succeed or neither does. A concurrent push is rejected
          # by normal fast-forward rules; never force-update main or a tag.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"
          printf 'Version: **%s**\n\nCommit: `%s`\n\nThe bot tag push starts the Release workflow. Review its draft before publishing.\n' "$RELEASE_TAG" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

# Unlike GITHUB_TOKEN, an App token's tag push triggers release.yml. Do not
# also call Release here: that would build the same version twice.
