name: Rust CI

# Runs on pull requests to main. It was disabled once to save runner minutes
# (#22), but the app is heading for distribution and it builds for three
# operating systems from one tree: without CI the whole
# `#[cfg(target_os = ...)]` surface is only ever compiled on whichever machine
# the work happened on, which is Windows.
#
# It also runs on `push: main`, and that run exists for its cargo cache rather
# than for its answer. A GitHub Actions cache can only be restored by the ref
# that wrote it or by the default branch, and a `pull_request` run writes to
# `refs/pull/N/merge` — a scope no other pull request can reach. With pull
# requests as the only trigger, nothing ever wrote a cache on main: across 48
# runs, every first run on a branch logged `No cache found` and rebuilt the
# whole dependency graph, which cost about eight minutes on Windows (12m48 to
# 14m19 cold against 4m49 to 5m39 warm). Merging to main now leaves a cache
# every later pull request can restore from, including a partial restore
# through the prefix key when the lockfile differs.
#
# That is also why `save-if` below limits writing to main: pull requests only
# read. It keeps the repository under the 10 GB cache ceiling, which the
# per-pull-request caches were already exceeding, and it takes the cache upload
# off the critical path.
#
# The expensive release build is not here; it lives in release.yml and hangs
# off the tag. This pipeline is CPU-only, see the comment below.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Unlike the jobs below, this filter is safe here: required status checks
    # apply to pull requests, and a push to main reports to nothing. A landing
    # page merge has no dependencies to warm.
    paths-ignore:
      - 'site/**'
  workflow_dispatch:

# A push to a branch cancels that branch's previous, still-running run.
# Otherwise every edit during review is paid for twice: the superseded run
# would finish the whole three-OS matrix for an answer nobody needs.
#
# Runs on main are not cancelled. Their point is the cache they leave behind,
# and two merges in quick succession would otherwise kill the first upload and
# send the next pull request back to a cold build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

# Every job builds the CPU variant: the whisper.cpp GPU backends sit behind
# the optional gpu-vulkan / gpu-metal features (see Cargo.toml), and without
# them the runner needs no Vulkan SDK. Do not add the SDK install here — the
# accelerator is covered by the release build, not by this pipeline.
jobs:
  # The landing page lives in site/ as a separate project with its own
  # lockfile and its own build. Editing site copy cannot break Rust, and the
  # three-OS matrix costs more than everything else combined, so the jobs
  # below skip it.
  #
  # The filter sits on the jobs rather than the workflow: `paths-ignore` was a
  # trap. Every required status check for main lives here, and a workflow that
  # never starts reports none of its contexts at all, so a site-only pull
  # request would hang forever on seven pending checks. A job skipped by `if:`
  # is counted as successful instead.
  #
  # That is also why the condition below is `!= 'false'` inside `!cancelled()`:
  # since a skip satisfies a required check, a failed gate would otherwise open
  # the merge with no checks at all. Refusing to check takes an explicit
  # `false`; silence does not.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      # The file list comes from the API rather than a checkout: the gate does
      # not need the tree, and full history just to run `git diff` costs more
      # than the answer itself.
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo 'Not a pull request — checking everything.'
            echo 'app=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename') || files=''
          # An empty response means the list could not be fetched. This gate
          # exists to save minutes, not to gate correctness: silence is read as
          # "the app was touched", and the required checks run for real.
          if printf '%s\n' "$files" | grep -qvE '^site/'; then
            echo 'Changes outside site/ — checking everything.'
            echo 'app=true' >> "$GITHUB_OUTPUT"
          else
            echo 'site/-only changes — skipping the application checks.'
            echo 'app=false' >> "$GITHUB_OUTPUT"
          fi

  security-audit:
    name: Dependency security audit
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 11.9.0

      # --audit-level high: this job gates every pull request, and a low or
      # moderate advisory somewhere in the dev graph is not a reason to block
      # a change that has nothing to do with it. The full list stays visible
      # in the job log.
      - name: Audit frontend lockfile
        working-directory: desktop
        run: pnpm audit --prod=false --audit-level high

      # Install a prebuilt binary instead of rustsec/audit-check. That action
      # runs `cargo install cargo-audit` without `--locked`, so every run
      # re-resolves fresh versions of cargo-audit's own dependencies. On
      # 2026-09-03 that is exactly what happened: the newly published tinyvec
      # 1.13.0 did not compile with our toolchain, and the gate went red on
      # every open pull request at once, none of which had anything to do with
      # it. That source build also took up most of the job (~5 runner minutes
      # per pull request).
      #
      # The pinned cargo-audit version is deliberate and does not go stale on
      # data: the advisory database is fetched from git at run time, not baked
      # into the binary. Bump it only if cargo-audit stops reading the current
      # Cargo.lock format.
      - name: Install cargo-audit
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b  # v2.87.4
        with:
          tool: cargo-audit@0.22.2

      # Call the binary directly rather than through `cargo audit`: the rustup
      # shim would read rust-toolchain.toml and download the whole pinned
      # toolchain, which auditing a lockfile does not need.
      - name: Audit Rust lockfile
        working-directory: desktop/src-tauri
        run: cargo-audit audit

  # ---------------------------------------------------------------
  # Formatting only. Clippy moved into build-test, where it already ran for
  # Windows and macOS. Keeping the Linux pass here meant standing up a whole
  # second environment — apt dependencies, Node, pnpm, a `pnpm build` for
  # `generate_context!()` and a cargo cache of its own — all of which
  # build-test builds for ubuntu anyway. Do not move clippy back here.
  #
  # rustfmt does not expand macros, so it needs no `desktop/dist`, and the
  # setup is down to the toolchain: this job should stay seconds long.
  # ---------------------------------------------------------------
  lint:
    name: Cargo fmt (Linux)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # The version and components come from rust-toolchain.toml at the repo
      # root — rustup reads it for any cargo invocation inside the repository
      # and overrides whatever the action installed. Repeating them here would
      # create a second place to forget on a bump.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch as of 2026-09-03

      - name: Format check
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check

  # ---------------------------------------------------------------
  # Build + test on every target platform. This is a Windows-first
  # app with a macOS port: previously CI only ran on Linux, so the
  # entire `#[cfg(windows)]` / `#[cfg(target_os = "macos")]` surface
  # (tray popup, WinAPI paste, overlay) was never compiled or tested
  # in CI, and Windows-only runtime failures were invisible.
  # ---------------------------------------------------------------
  build-test:
    name: Build + test (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ${{ matrix.os }}
    # Allow time for the Clippy pass that runs before the build.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # The version comes from rust-toolchain.toml — see the lint job.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch as of 2026-09-03

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            libasound2-dev \
            libudev-dev \
            libxdo-dev \
            libxkbcommon-dev

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          key: ggml-baseline-${{ hashFiles('.cargo/config.toml', 'scripts/ggml-baseline.cmake') }}
          cache-on-failure: false
          # Only main writes; see the note on the triggers above. A pull
          # request that pushes several times now restores from main each time
          # instead of from its own previous run, which is a full match unless
          # it changed the lockfile and a prefix restore when it did.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .node-version

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 11.9.0

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build frontend (produces desktop/dist for Tauri macro)
        working-directory: desktop
        run: pnpm build

      # `sherpa-onnx-sys` downloads the native archive itself and does not
      # verify its hash. Download and check it here, then hand the build script
      # a ready directory through SHERPA_ONNX_LIB_DIR so it never touches the
      # network.
      - name: Download and verify the sherpa native runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-sherpa-runtime.ps1 -Target win-x64-shared

      - name: Download and verify the sherpa native runtime (macOS)
        if: runner.os == 'macOS'
        run: sh scripts/fetch-sherpa-runtime.sh osx-arm64-static

      # `tauri.windows.conf.json` declares `.tauri-native/windows/x64/*.dll`
      # as a resource, and the build script fails when that glob matches
      # nothing. Those DLLs are staged by `prepare-native-libs.ps1`, but it
      # hangs off `beforeBundleCommand`, so it only runs under `tauri build` —
      # under a plain `cargo build` the directory does not exist at all. On a
      # developer machine it survives from the previous build; on a clean
      # runner it does not.
      #
      # The script takes the DLLs from `target/[<triple>/]<profile>`, where the
      # `sherpa-onnx-sys` build script puts them, so build that crate first.
      # On its own, not the whole graph: a full `cargo build` is precisely the
      # step that fails when the DLLs are not staged.
      - name: Stage the sherpa native runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop/src-tauri
        env:
          # Profile for the script: both commands below run in debug.
          TAURI_ENV_DEBUG: "true"
        run: |
          cargo build --locked -p sherpa-onnx-sys
          # On a warm-cache run that is not enough. Before saving, rust-cache
          # prunes everything from the root of `target/<profile>` that is not a
          # dependency artifact, and the DLLs staged by the script are caught by
          # that, while the crate's `.fingerprint` survives. Cargo therefore
          # considers the build script already run and does not rerun it — the
          # files are gone, yet as far as cargo is concerned there is nothing to
          # build. Clean exactly that one crate: the build script then runs
          # again, which takes about ten seconds because there is nothing left
          # to download.
          if (-not (Test-Path 'target/debug/sherpa-onnx-c-api.dll')) {
            cargo clean -p sherpa-onnx-sys
            cargo build --locked -p sherpa-onnx-sys
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File prepare-native-libs.ps1

      # Clippy on all three operating systems, Linux included. The Linux pass
      # used to live in a separate lint job that stood up its own environment
      # for it — apt dependencies, Node, pnpm, a frontend build and its own
      # cargo cache — even though this job builds exactly that for ubuntu
      # anyway. Here the target directory is already warm from the steps above.
      #
      # `--all-targets` is load-bearing, not cosmetic: it pulls in the
      # benchmarks, which neither `cargo build` nor `cargo test` compiles, so
      # they rot silently — and once did (f28dd7b, "the bench compiles again
      # after model_id was added"). They used to be guarded by a separate
      # `cargo bench --no-run` step, but that did a full opt-level 3 build and
      # cost 16 minutes out of 23, catching nothing beyond clippy except
      # codegen and link failures. Do not drop `--all-targets`.
      - name: Clippy (deny warnings)
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        working-directory: desktop/src-tauri
        run: cargo build --locked --verbose

      - name: Verify compiled Whisper CPU baseline
        run: node scripts/check-ggml-baseline.mjs desktop/src-tauri/target

      - name: Test model benchmark arguments
        working-directory: desktop/src-tauri
        run: cargo test --locked --example model_benchmark

      - name: Test
        working-directory: desktop/src-tauri
        run: cargo test --locked --verbose

      - name: Check embedded macOS native runtime
        if: runner.os == 'macOS'
        run: sh scripts/check-macos-native-libs.sh desktop/src-tauri/target/debug/Sotto

      - name: Whisper download and speech inference smoke test
        working-directory: desktop/src-tauri
        run: cargo test --locked --test test_whisper_engine -- --ignored --nocapture

      - name: Sherpa download and inference smoke test
        if: runner.os == 'macOS' || runner.os == 'Windows'
        working-directory: desktop/src-tauri
        run: cargo test --locked --test test_sherpa_runtime -- --ignored --nocapture

  frontend-test:
    name: TypeScript typecheck + build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 11.9.0

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('desktop/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: desktop
        run: npx tsc --noEmit

      # The Playwright harness has its own tsconfig: it lives outside
      # desktop/src and the run above does not cover it. Without this step a
      # change to the bridge types would break the mocks silently, surfacing
      # only when a UI test fails and the cause is no longer visible.
      - name: Typecheck UI test harness
        working-directory: desktop
        run: npx tsc --noEmit -p ../tests/ui/tsconfig.json

      - name: Translation coverage
        working-directory: desktop
        run: pnpm i18n:check

      - name: Unit tests (Vitest)
        working-directory: desktop
        run: pnpm test

      - name: Build
        working-directory: desktop
        run: pnpm build

      # Initial window payload budget. Vite's 500 KB warning does not fail the
      # build, so the weight creeps up unnoticed; here it can only grow
      # together with a deliberately raised threshold.
      - name: Bundle size budget
        working-directory: desktop
        run: pnpm bundle:check

  # Static gate: no `sidecar_invoke` left in the frontend.
  # Catches regressions if a new caller reintroduces the legacy
  # Python sidecar RPC.
  static-gate:
    name: Static gate — no sidecar_invoke / Python runtime
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .node-version

      - name: Release version regression tests
        run: node --test scripts/release-version.test.mjs scripts/check-release-source.test.mjs

      - name: CPU baseline regression tests
        run: node --test scripts/check-ggml-baseline.test.mjs

      - name: Application version consistency
        run: sh scripts/check-version.sh

      # Pin actions to immutable commits so tag moves cannot change CI code.
      - name: Every GitHub Action is pinned to a commit SHA
        run: |
          # Pinned means either a full SHA or a workflow from this same
          # repository (`./…`), which has no third-party owner who could swap
          # anything out.
          ok='uses: *(\./|[A-Za-z0-9._-]+/[A-Za-z0-9._/-]+@[0-9a-f]{40}( |$))'
          floating=$(grep -rnE '^ *-? *uses:' .github/workflows/ | grep -vE "$ok" || true)
          if [ -n "$floating" ]; then
            echo "::error::These actions are not pinned to a full commit SHA:"
            echo "$floating"
            echo "See docs/development.md → Pinned GitHub Actions"
            exit 1
          fi

      - name: No sidecar_invoke in frontend
        run: |
          if grep -rn "sidecar_invoke" desktop/src/; then
            echo "::error::sidecar_invoke must not appear in the frontend"
            exit 1
          fi

      - name: No Python runtime files
        run: |
          # Use `git ls-files` (not `find`) for path-aware gating.
          # `find -path` syntax for excluding dirs is brittle across
          # GNU find versions. We only flag Python files that the
          # repo ACTUALLY tracks within three path segments (`a/b/c.py`).
          # Allow Python helpers in `scripts/` and browser tests in
          # `tests/ui/`; neither is part of the application runtime.
          leaked=$(git ls-files -z -- '*.py' \
              | tr '\0' '\n' \
              | awk -F/ 'NF<=3 && $1!="scripts" && !($1=="tests" && $2=="ui")' )
          if [ -n "$leaked" ]; then
            echo "::error::Python runtime files leaked into the repo root:"
            echo "$leaked"
            exit 1
          fi
          if [ -d venv ]; then
            echo "::error::venv/ leaked into the repo root"
            exit 1
          fi
