name: Release

# Called by Prepare Release, by a tag push, or manually to retry a draft build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.2.0"
        required: true

  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

concurrency:
  group: release-build-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Verify tag and refuse published releases
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sh scripts/check-version.sh "$RELEASE_TAG"
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false) | .tag_name')
          if printf '%s\n' "$published" | grep -Fxq "$RELEASE_TAG"; then
            echo '::error::Published releases cannot be rebuilt. Prepare a new version.'
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  browser-ui:
    needs: resolve
    uses: ./.github/workflows/ui-tests.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  release:
    name: Build and sign
    needs: [resolve, browser-ui]
    permissions:
      # tauri-action creates the draft release and uploads artifacts into it.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --features gpu-*: GPU backends are opt-in (see Cargo.toml), so a
          # release that forgot them would quietly ship CPU-only inference.
          # target_dir: the build directory is moved out of the working copy.
          # whisper.cpp sources are unpacked underneath it, and MSVC/clang bake
          # those paths into the binary through __FILE__. Inside the workspace
          # that would be a path carrying the repository name; outside it is
          # neutral. See #41.
          - platform: windows-latest
            target_triple: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc --features gpu-vulkan -- --locked"
            target_dir: 'D:\b'
          - platform: macos-latest
            target_triple: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --features gpu-metal -- --locked"
            target_dir: "/tmp/b"
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
      CARGO_BUILD_TARGET: ${{ matrix.target_triple }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      # The version comes from rust-toolchain.toml at the repo root; all that
      # is left here is the target triple, which that file does not carry.
      - name: Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch as of 2026-09-03
        with:
          targets: ${{ matrix.target_triple }}

      - name: Verify release version consistency
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: sh scripts/check-version.sh "$RELEASE_TAG"

      # rustc bakes every dependency's file!() into panic messages, and that
      # means $CARGO_HOME/registry — the runner user's home directory. Runner
      # paths do not identify the maintainer, but they still have no business
      # being in a distributed artifact. The trim-paths profile option would do
      # this declaratively, but in Cargo 1.95 it requires nightly.
      #
      # The separator is a space rather than \x1f as in build-installer.sh:
      # runner paths never contain spaces, and a plain RUSTFLAGS stays readable.
      # This step comes before rust-cache: the cache key is derived from the
      # build flags.
      - name: Remap build paths
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          workspace="$GITHUB_WORKSPACE"
          # rustc sees paths in the OS-native form, while bash on Windows sees
          # the msys form (/c/Users/…). A remap whose prefix does not match
          # silently does nothing, so convert to the Windows form where there
          # is one.
          if command -v cygpath >/dev/null 2>&1; then
            cargo_home=$(cygpath -w "$cargo_home")
            workspace=$(cygpath -w "$workspace")
          fi
          echo "RUSTFLAGS=--remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$workspace=/build" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: desktop/src-tauri
          key: ggml-baseline-${{ hashFiles('.cargo/config.toml', 'scripts/ggml-baseline.cmake') }}

      # whisper.cpp is built with the Vulkan backend, which needs glslc and
      # the headers. At runtime vulkan-1.dll ships with the GPU driver, so the
      # SDK is only needed here. See project_vulkan_build: without VULKAN_SDK
      # cargo will not build.
      #
      # The pinned version has a shelf life: LunarG removes builds older than
      # roughly two years from sdk.lunarg.com, and the version simply stops
      # downloading. That is how 1.3.280.0 (February 2024) died: the step
      # failed within a minute on `curl failed with error code: 22` and
      # `HTTP/1.1 404 Not Found`. Pick a new version here:
      # https://vulkan.lunarg.com/sdk/home
      #
      # The action is jakoch, not humbletim/install-vulkan-sdk. That one
      # unpacked the installer with a single `7z x`, and on the 1.4.x layout it
      # laid out the tree so that CMake found neither headers nor libraries:
      #   Could NOT find Vulkan (missing: Vulkan_LIBRARY Vulkan_INCLUDE_DIR)
      # The step itself still reported success — glslangValidator was in place,
      # 817 MB unpacked — so the breakage only surfaced eleven minutes later,
      # in the whisper-rs-sys build script.
      - name: Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest'
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa  # v1.6.0
        with:
          vulkan_version: 1.4.357.0
          # vulkan-1.dll ships with the GPU driver at runtime; the runner does
          # not need it. The SDK is here only for headers, .lib files and glslc.
          install_runtime: false
          cache: true

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # `sherpa-onnx-sys` downloads the native archive itself and does not
      # verify its hash. Download and check it here, then hand the build script
      # a ready directory through SHERPA_ONNX_LIB_DIR: it never touches the
      # network, and no unverified code reaches the release binary.
      - name: Download and verify the sherpa native runtime (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/fetch-sherpa-runtime.ps1 -Target win-x64-shared

      - name: Download and verify the sherpa native runtime (macOS)
        if: runner.os == 'macOS'
        run: sh scripts/fetch-sherpa-runtime.sh osx-arm64-static

      # `tauri.windows.conf.json` declares `.tauri-native/windows/x64/*.dll`
      # as a resource, and the build script fails when that glob matches
      # nothing:
      #   glob pattern .tauri-native/windows/x64/*.dll path not found
      # Those DLLs are staged by `prepare-native-libs.ps1`, but it hangs off
      # `beforeBundleCommand`, so it runs AFTER compilation — and compilation is
      # exactly what fails. On a developer machine the directory survives from
      # the previous build; on a clean runner it does not exist at all, so it
      # needs an explicit step here. The same step with the same rationale is in
      # rust-ci.yml; the only differences are the profile (release, not debug)
      # and that CARGO_BUILD_TARGET is set here, so Cargo puts everything under
      # the triple.
      - name: Stage the sherpa native runtime (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          cargo build --release --locked -p sherpa-onnx-sys
          # On a warm-cache run that is not enough: before saving, rust-cache
          # prunes everything from `target/<triple>/<profile>` that is not a
          # dependency artifact, and the staged DLLs are caught by that, while
          # the crate's `.fingerprint` survives. Cargo therefore considers the
          # build script already run and does not rerun it. Clean exactly that
          # one crate — it has nothing left to download, so this takes seconds.
          $dll = Join-Path $env:CARGO_TARGET_DIR (Join-Path $env:CARGO_BUILD_TARGET 'release/sherpa-onnx-c-api.dll')
          if (-not (Test-Path -LiteralPath $dll)) {
            cargo clean -p sherpa-onnx-sys
            cargo build --release --locked -p sherpa-onnx-sys
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File prepare-native-libs.ps1

      - name: Verify the macOS static runtime before packaging
        if: runner.os == 'macOS'
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          pnpm --dir .. build
          cargo build --release --locked --features gpu-metal
          sh ../../scripts/check-macos-native-libs.sh "$CARGO_TARGET_DIR/$CARGO_BUILD_TARGET/release/Sotto"

      # A stable code signature is what macOS keys the microphone and
      # Accessibility grants to: an ad-hoc signature is identified by the
      # code hash, so every release looks like a new application and both
      # permissions are dropped on update. The identity only has to stay
      # the same across releases — Gatekeeper still wants Developer ID and
      # notarization, which is a separate purchase (see docs/RELEASE.md).
      # The bundler runs plain `codesign -s`, so the identity has to be in
      # the search list; APPLE_CERTIFICATE is deliberately not exported,
      # because the bundler only recognises Apple-issued names through it.
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGNING_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -eu
          if [ -z "$SIGNING_CERTIFICATE" ] || [ -z "$SIGNING_CERTIFICATE_PASSWORD" ] || [ -z "$SIGNING_IDENTITY" ]; then
            echo "::warning::macOS signing secrets are missing; the bundle stays ad-hoc signed and users lose their permissions on update."
            exit 0
          fi
          keychain="$RUNNER_TEMP/sotto-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/sotto-signing.p12"
          printf '%s' "$SIGNING_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          # No flags: the keychain neither times out nor locks on sleep,
          # and the build runs for the better part of an hour.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          rm -f "$certificate"
          # Prepend, keeping the login keychain so nothing else on the
          # runner loses its own credentials. The list is one quoted path
          # per line and has to reach `-s` as separate arguments.
          existing=$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build, sign and upload
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The private minisign key. Its public half lives in
          # tauri.conf.json → plugins.updater.pubkey; if the pair does not
          # match, an installed app refuses to apply the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The project's public PostHog ingest token, not a personal key. It
          # is compiled into the binary through option_env!, so a missing secret
          # produces a silent build indistinguishable from a working one. There
          # is no guard here like the one in build-installer.sh — see
          # docs/RELEASE.md → Telemetry Ingest Token.
          SOTTO_POSTHOG_API_KEY: ${{ secrets.SOTTO_POSTHOG_API_KEY }}
        with:
          projectPath: desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Sotto ${{ inputs.tag || github.ref_name }}"
          # There is deliberately no releaseBody key: the updater shows the
          # release body as "what's new", so the notes are written by hand on
          # the GitHub release itself. See docs/RELEASE.md → Publish.
          # A draft rather than an immediate publish: users pick up latest.json
          # the moment the release stops being a draft — that is, after the
          # build has been checked by hand.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # The disk image comes from dmgbuild rather than the bundler: Tauri lays
      # out the Finder window through AppleScript, which a headless runner
      # cannot drive and current macOS does not persist. The bundler still
      # produces the signed Sotto.app and the updater archive; scripts/build-dmg.sh
      # signs the image with the same identity. See docs/installer-design.md.
      - name: Build and upload the macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/dmg-bootstrap"
          "$RUNNER_TEMP/dmg-bootstrap/bin/pip" install uv==0.12.17
          export PATH="$RUNNER_TEMP/dmg-bootstrap/bin:$PATH"
          version=$(node -p "require('./desktop/package.json').version")
          image="$RUNNER_TEMP/Sotto_${version}_aarch64.dmg"
          sh scripts/build-dmg.sh "$CARGO_TARGET_DIR/$CARGO_BUILD_TARGET/release/bundle/macos/Sotto.app" "$image"
          gh release upload "$RELEASE_TAG" "$image" --clobber

      - name: Verify compiled Whisper CPU baseline
        shell: bash
        run: node scripts/check-ggml-baseline.mjs "$CARGO_TARGET_DIR"

      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $binaryDirectory = Join-Path $env:CARGO_TARGET_DIR "$env:CARGO_BUILD_TARGET/release"
          $archive = Join-Path $env:RUNNER_TEMP "Sotto-$env:RELEASE_TAG-windows-x64-portable.zip"
          ./scripts/build-portable.ps1 -BinaryDirectory $binaryDirectory -OutputPath $archive
          gh release upload $env:RELEASE_TAG $archive --clobber
          if ($LASTEXITCODE -ne 0) { throw "Portable ZIP upload failed" }

      # By this point the artifacts are already in the draft release: this step
      # does not undo the upload, it gives a reason not to publish the draft.
      # Publishing is manual anyway, so that is enough. See #41.
      - name: Check the binary for build machine paths
        shell: bash
        run: |
          target_dir="$CARGO_TARGET_DIR"
          # The same conversion as in "Remap build paths": find needs the msys
          # form of the path, while Cargo and PowerShell need the native one.
          if command -v cygpath >/dev/null 2>&1; then
            target_dir=$(cygpath -u "$target_dir")
          fi
          bin=$(find "$target_dir" -maxdepth 3 -type f \
            \( -name Sotto -o -name Sotto.exe \) | head -1)
          if [ -z "$bin" ]; then
            echo "binary not found in $target_dir"
            exit 1
          fi
          py=$(command -v python3 || command -v python)
          "$py" scripts/check-build-paths.py "$bin"

  # The SBOM is generated after tauri-action has created the draft: otherwise
  # there is nowhere to upload the asset. A separate call rather than a step
  # inside the matrix, because the dependency inventory is one per release, not
  # one per platform.
  sbom:
    name: Release SBOM
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/sbom.yml
    with:
      release_tag: ${{ inputs.tag || github.ref_name }}

  # Checksums are one of the few things a user can verify themselves while the
  # builds are not signed with a publisher certificate. A separate job after
  # both builds and the SBOM: the file is one per release and must cover
  # everything in the draft, whereas one computed inside the matrix would only
  # know about its own platform.
  checksums:
    name: Release checksums
    needs: [release, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Compute SHA-256 and attach to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets
          # The draft is only visible to a token with contents: write — there
          # is no public link to it yet.
          gh release download "$RELEASE_TAG" --clobber
          # The format is exactly what `sha256sum -c` understands, so the file
          # carries no headers or comments: the explanation lives in
          # docs/verifying-downloads.md and the file stays machine-verifiable.
          # The checksum file itself is excluded from the list: it could be left
          # over from a re-release and would end up hashing itself.
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber
