name: SBOM

# Инвентарь того, из чего собрано приложение: CycloneDX для Rust и npm плюс
# читаемый отчёт по лицензиям. Считается не на каждый PR — граф зависимостей
# меняется только вместе с lock-файлами, поэтому на них и висит.
#
# На теге релиза вызывается из release.yml, уже после того как tauri-action
# создал черновик: тогда SBOM кладётся в него как ассет, а не остаётся
# артефактом прогона, который истечёт.
on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/pnpm-lock.yaml"
      - "desktop/package.json"
      - "desktop/src-tauri/Cargo.lock"
      - "desktop/src-tauri/Cargo.toml"
      - ".github/workflows/sbom.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: "Тег релиза: SBOM прикладывается к черновику с этим тегом"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbom:
    name: Собрать SBOM и отчёт по лицензиям
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Заливка ассета в черновик релиза. Без release_tag не используется.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 11.9.0

      # Версию задаёт rust-toolchain.toml в корне.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # ветка stable на 2026-09-03

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          cache-on-failure: true

      - run: mkdir -p sbom

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      # --target all: половина графа приезжает через `[target.'cfg(...)']`
      # (windows-sys, objc2, ashpd). Без этого флага инвентарь описывал бы
      # только Linux-раннер, а раздаём мы Windows и macOS.
      # --all-features: gpu-vulkan / gpu-metal опциональны, но в релиз идут.
      - name: SBOM — Rust
        working-directory: desktop/src-tauri
        run: |
          cargo cyclonedx \
            --format json \
            --spec-version 1.5 \
            --all-features \
            --target all \
            --override-filename sbom-rust
          mv sbom-rust.json "$GITHUB_WORKSPACE/sbom/sbom-rust.cdx.json"

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: SBOM — npm
        working-directory: desktop
        run: |
          pnpm dlx @cyclonedx/cdxgen@12.8.4 \
            -t pnpm \
            --spec-version 1.6 \
            -o "$GITHUB_WORKSPACE/sbom/sbom-npm.cdx.json" \
            .

      # Читаемый срез поверх SBOM: что и под какой лицензией пришло. `paths`
      # из вывода pnpm выкидываем — это абсолютные пути раннера, в артефакте
      # им делать нечего.
      - name: Отчёт по лицензиям npm
        working-directory: desktop
        run: |
          for scope in prod dev; do
            if [ "$scope" = prod ]; then flag=--prod; else flag=--dev; fi
            pnpm licenses list "$flag" --json > "/tmp/licenses-$scope.json"
            node -e '
              const fs = require("fs");
              const src = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              for (const group of Object.values(src)) {
                for (const pkg of group) delete pkg.paths;
              }
              fs.writeFileSync(process.argv[2], JSON.stringify(src, null, 2) + "\n");
            ' "/tmp/licenses-$scope.json" "$GITHUB_WORKSPACE/sbom/licenses-npm-$scope.json"
          done

      # Не гейт, а сводка в логе: сколько компонентов попало в инвентарь и у
      # скольких не нашлось лицензии. Пустая лицензия — не всегда проблема
      # (платформенные бинарники esbuild под чужую ОС не устанавливаются, и
      # читать их package.json неоткуда), но это то, на что смотрят глазами.
      - name: Сводка
        run: |
          node -e '
            const fs = require("fs");
            for (const f of ["sbom/sbom-rust.cdx.json", "sbom/sbom-npm.cdx.json"]) {
              const bom = JSON.parse(fs.readFileSync(f, "utf8"));
              const comps = bom.components || [];
              const noLicense = comps.filter((c) => !c.licenses || c.licenses.length === 0);
              console.log(`${f}: ${comps.length} компонент(ов), без лицензии ${noLicense.length}`);
              for (const c of noLicense.slice(0, 20)) console.log(`    ${c.name}@${c.version}`);
              if (noLicense.length > 20) console.log(`    … ещё ${noLicense.length - 20}`);
            }
          '

      - name: Выложить как артефакт прогона
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

      - name: Приложить к черновику релиза
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.release_tag }}" sbom/* --clobber
