name: Site

# Зеркало к paths-ignore в rust-ci.yml и ui-tests.yml: те игнорируют site/,
# этот воркфлоу смотрит только на него. Так правка лендинга не запускает
# матрицу из трёх ОС, а правка Rust не собирает Astro.
#
# Деплоя здесь пока нет: хостинг и домен не выбраны. Когда выберутся, сюда
# добавляется job с триггером `release: published` — по образцу docs.yml в
# stablyai/orca, где проверочный job намеренно без креденшелов, чтобы
# собираться и с форков.
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: site/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
