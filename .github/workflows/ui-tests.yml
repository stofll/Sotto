name: UI tests

on:
  pull_request:
    branches: [main]
    # This checks the application UI from desktop/. The landing page in site/
    # is unrelated and is covered by its own build.
    paths-ignore:
      - 'site/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source revision to test before packaging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    # The serial dev WebKit run reached 15 minutes with every test passing.
    # This only guards against a hang; #39 tracks running the suite in parallel.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [production, dev]
        browser: [chromium, webkit]
        include:
          - browser: chromium
            platform: windows
          - browser: webkit
            platform: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Install Python test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/ui-bootstrap"
          "$RUNNER_TEMP/ui-bootstrap/bin/pip" install uv==0.12.17
          echo "$RUNNER_TEMP/ui-bootstrap/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ui-bootstrap/bin/uv" sync --locked --project tests/ui --python 3.12
      - name: Install browsers
        run: uv run --locked --project tests/ui playwright install --with-deps ${{ matrix.browser }}
      - name: Check Python tests
        run: |
          uv run --locked --project tests/ui ruff check tests/ui
          uv run --locked --project tests/ui ruff format --check tests/ui
      # The harness types are checked by the frontend-test job in rust-ci.yml,
      # once per pull request. Here the same `tsc -p tests/ui/tsconfig.json`
      # was fanned out by the matrix into four runs giving one answer.
      - name: Test ${{ matrix.mode }} UI in ${{ matrix.browser }}
        run: uv run --locked --project tests/ui pytest tests/ui --browser ${{ matrix.browser }} --ui-mode ${{ matrix.mode }} --ui-build-platform ${{ matrix.platform }} --junitxml=test-results/junit.xml
      - name: Upload failure traces and test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-results-${{ matrix.browser }}-${{ matrix.mode }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the single check name used to gate the PR.
  browser-ui:
    if: always()
    needs: browser-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require both browsers and build modes to pass
        env:
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
        run: test "$BROWSER_RESULT" = success
