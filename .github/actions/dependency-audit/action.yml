name: Dependency audit
description: >-
  Audits every lockfile in the repository against published advisories. Used
  by the required pull request check in rust-ci.yml and by the weekly run in
  security-audit.yml, so both audit the same set. Expects a checkout.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 11.9.0

    # --audit-level high: this gates every pull request, and a low or moderate
    # advisory somewhere in the dev graph is not a reason to block a change
    # that has nothing to do with it. The full list stays visible in the log.
    - name: Audit frontend lockfile
      shell: bash
      working-directory: desktop
      run: pnpm audit --prod=false --audit-level high

    - name: Audit landing page lockfile
      shell: bash
      working-directory: site
      run: pnpm audit --prod=false --audit-level high

    - name: Install Python dependency tool
      uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
      with:
        tool: uv@0.13.5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch as of 2026-09-03

    - name: Cache dependency audit build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: scripts/dependency-audit -> target
        key: dependency-audit
        cache-on-failure: false
        save-if: ${{ github.ref == 'refs/heads/main' }}

    # The upstream release binary still embeds vulnerable TLS dependencies.
    # Build its public CLI with our reviewed lockfile, retaining all features
    # and live advisory/yanked checks, then audit that same build graph below.
    - name: Build dependency audit tool
      shell: bash
      run: |
        cargo build --locked --release --manifest-path scripts/dependency-audit/Cargo.toml
        echo "$GITHUB_WORKSPACE/scripts/dependency-audit/target/release" >> "$GITHUB_PATH"

    - name: Audit exact Python test dependencies
      shell: bash
      run: |
        uv export --locked --project tests/ui --format requirements-txt --no-emit-project --output-file "$RUNNER_TEMP/ui-audit.txt"
        uvx --python 3.12 --from pip-audit==2.10.1 pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/ui-audit.txt"

    - name: Audit exact macOS disk image dependencies
      shell: bash
      run: |
        uv export --locked --project scripts/macos-dmg --format requirements-txt --no-emit-project --output-file "$RUNNER_TEMP/dmg-audit.txt"
        uvx --python 3.12 --from pip-audit==2.10.1 pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/dmg-audit.txt"

    - name: Audit dependency audit tool lockfile
      shell: bash
      working-directory: scripts/dependency-audit
      run: cargo-audit audit

    - name: Audit Rust lockfile
      shell: bash
      working-directory: desktop/src-tauri
      run: cargo-audit audit

    - name: Audit Windows setup lockfile
      shell: bash
      working-directory: desktop/setup/src-tauri
      run: cargo-audit audit
