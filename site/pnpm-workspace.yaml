# Mirrors desktop/pnpm-workspace.yaml: pnpm v9+ blocks postinstall scripts by
# default, and esbuild needs its own to bootstrap Vite. The explicit `packages`
# list is what makes `pnpm install --frozen-lockfile` accept this project.
#
# `site/` is a standalone install on purpose: it is not a member of the
# desktop/ workspace, so the landing page and the app never share a lockfile.
packages:
  - "."

allowBuilds:
  esbuild: true

# Potrace's legacy Jimp dependency uses phin 2; retain the local PNG tracing
# workflow while removing GHSA-x565-32qp-m3vf from its dependency graph.
overrides:
  'phin@<3.7.1': 3.7.1
