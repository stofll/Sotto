# Mirrors desktop/pnpm-workspace.yaml: pnpm v9+ blocks postinstall scripts by
# default, and esbuild needs its own to bootstrap Vite. The explicit `packages`
# list is what makes `pnpm install --frozen-lockfile` accept this project.
#
# `site/` is a standalone install on purpose: it is not a member of the
# desktop/ workspace, so the landing page and the app never share a lockfile.
packages:
  - "."

allowBuilds:
  esbuild: true
  # wrangler-action installs wrangler at deploy time, and pnpm fails that install
  # on any unreviewed build script. workerd's script sets up the binary behind
  # `wrangler dev`, which a static-assets deploy never starts.
  workerd: false

auditConfig:
  ignoreGhsas:
    # http-cache-semantics <= 4.2.0 via astro; 4.2.1 is not on npm yet. Astro
    # uses it only for its build-time remote-image cache, and this static site
    # has no runtime cache to leak. Remove with the lockfile update in #86.
    - GHSA-ch52-4w7c-c8xp
